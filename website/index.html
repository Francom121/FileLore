<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileLore — Your files remember</title>
    <meta
      name="description"
      content="FileLore attaches sticky notes to any file on your Mac. Notes, prompts, and reference files travel with the file — no database, no cloud, no lock-in."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="FileLore — Your files remember" />
    <meta
      property="og:description"
      content="Sticky notes that live ON your files. They travel with it through renames, moves, and everything else."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-512.png" />
  </head>
  <body>
    <!-- Hidden static copy so Netlify's deploy-time parser detects the React-rendered contact form -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
